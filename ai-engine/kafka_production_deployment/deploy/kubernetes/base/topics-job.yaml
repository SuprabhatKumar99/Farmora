apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: bitnami/kafka:3.9
          command:
            - /bin/bash
            - -ec
            - |
              until /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done
              for topic in ai.inference.request ai.inference.completed ai.inference.failed ai.inference.dlq followup.feedback.received; do
                /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$topic" --partitions 3 --replication-factor 1
              done
